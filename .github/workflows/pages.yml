name: GitHub Pages

# Publish dataviz.sent-tech.ca as a redirect to the Sentropic design system.
# This repository holds no code any more: @sentropic/dataviz-* moved to
# rhanka/sent-tech-design-system. Every path on this domain must land on the
# redirect page, so it is deployed twice — as the root document and as the
# 404 catch-all, which GitHub Pages serves for any unknown path (historical deep
# links and the former /demos/* included). A static host cannot issue a 301:
# those paths keep a 404 status and redirect with JS (location.replace) and
# without it (meta refresh). A true 301 needs a redirect rule at the DNS/proxy
# layer (the sent-tech.ca zone is on Cloudflare).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the redirect site
        run: |
          mkdir -p _site
          cp site/redirect.html _site/index.html
          cp site/redirect.html _site/404.html
          # Custom domain (keeps the Pages custom-domain binding across deploys).
          echo dataviz.sent-tech.ca > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
