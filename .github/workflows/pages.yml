name: GitHub Pages

# Publish dataviz.sent-tech.ca. The docs/gallery SPA (apps/site) is no longer
# deployed: @sentropic/dataviz-* moved to the Sentropic design system, so EVERY
# path on this domain must land on the redirect page (apps/site/redirect.html).
# GitHub Pages resolves any unknown path with the published-site-root 404.html,
# so that page is deployed twice — as the root document and as the catch-all —
# which makes historical deep links (/charts, /charts/treemap, /dashboards, …)
# redirect instead of rendering a stale gallery. The three framework demos keep
# their own real paths under /demos/* (relative base).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Builds packages + every app workspace. apps/site still builds (it stays
      # a compile gate and a local `npm run dev` target) but its dist is NOT
      # deployed any more, so DV_SITE_BASE no longer matters here; only the
      # three demos (relative base) are published, under /demos/*.
      - run: npm run build
      - name: Assemble site (redirect on every path + per-framework demos)
        run: |
          mkdir -p _site
          # Nothing from apps/site/dist is copied: publishing the SPA shell is
          # what made /charts & co. answer with an unmaintained gallery.
          # The redirect page is the root document AND the 404 catch-all, so
          # every unknown path (every historical deep link) redirects to the
          # design system — with JS (location.replace) and without (meta
          # refresh). GitHub Pages still returns the 404 status code for those
          # paths: a static host cannot issue a 301 here.
          cp apps/site/redirect.html _site/index.html
          cp apps/site/redirect.html _site/404.html
          # Custom domain (keeps the Pages custom-domain binding across deploys).
          echo dataviz.sent-tech.ca > _site/CNAME
          # The three framework demos (relative base) under /demos/*. These are
          # real published paths, resolved before the 404 fallback.
          mkdir -p _site/demos
          cp -r apps/docs/dist _site/demos/svelte
          cp -r apps/docs-react/dist _site/demos/react
          cp -r apps/docs-vue/dist _site/demos/vue
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
